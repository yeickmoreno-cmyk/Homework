<style>
  .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; font-family: sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .title { color: #0284c7; margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
  .bar { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 20px; padding: 10px 16px; font-family: monospace; margin: 15px 0; color: #0f172a; }
  .btn-group { display: flex; gap: 10px; }
  button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
</style>

<div class="card">
  <h2 class="title">Historial del Navegador (Lista Doble)</h2>
  @if (currentPage) {
    <div class="bar">
       https://{{ currentPage.value?.url }}
    </div>
    <div class="btn-group">
      <button (click)="goBack()" [disabled]="!currentPage.prev">Atras</button>
      <button (click)="goForward()" [disabled]="!currentPage.next">Adelante </button>
    </div>
  }
</div>
