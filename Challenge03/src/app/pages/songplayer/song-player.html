<style>
  .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; font-family: sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .title { color: #4f46e5; margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
  .info { background: #f8fafc; border-left: 4px solid #6366f1; padding: 12px 16px; border-radius: 6px; margin: 15px 0; }
  .info p { margin: 4px 0; }
  button { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
</style>

<div class="card">
  <h2 class="title">Reproductor de Música (Lista Simple)</h2>
  @if (currentSong) {
    <div class="info">
      <p><strong>Título:</strong> {{ currentSong.value?.title }}</p>
      <p><strong>Artista:</strong> {{ currentSong.value?.artist }}</p>
    </div>
    <button (click)="nextSong()" [disabled]="!currentSong.next">
      Siguiente Canción ⏭
    </button>
  }
</div>
