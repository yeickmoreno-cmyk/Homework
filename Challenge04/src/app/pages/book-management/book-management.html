<div class="page-container">
  
  <!-- FORMULARIO (Punto 3) -->
  <div class="card form-card">
    <h2 class="title-form">Agregar Libro (Push)</h2>
    <form (ngSubmit)="addBook()">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" [(ngModel)]="newBook.name" name="name" required>
      </div>
      <div class="form-group">
        <label>ISBN:</label>
        <input type="text" [(ngModel)]="newBook.isbn" name="isbn" required>
      </div>
      <div class="form-group">
        <label>Autor:</label>
        <input type="text" [(ngModel)]="newBook.author" name="author" required>
      </div>
      <div class="form-group">
        <label>Editorial:</label>
        <input type="text" [(ngModel)]="newBook.editorial" name="editorial" required>
      </div>
      <div class="contenedor-boton">
        <button type="submit" class="btn-submit">Guardar en la Pila</button>
      </div>
    </form>
  </div>

  <!-- IMPRESIÓN DE LA PILA (Punto 4) -->
  <div class="card stack-card">
    <h2 class="title-stack">Pila de Libros (Stack)</h2>
    
    <div class="stack-list">
      @for (book of booksList; track book.isbn; let i = $index) {
        <div class="book-item">
          @if (i === 0) {
            <span class="badge-top">TOPE</span>
          }
          <h3>{{ book.name }}</h3>
          <p><strong>Autor:</strong> {{ book.author }}</p>
          <p><strong>Editorial:</strong> {{ book.editorial }}</p>
          <p><strong>ISBN:</strong> {{ book.isbn }}</p>
        </div>
      }
    </div>
  </div>

</div>
