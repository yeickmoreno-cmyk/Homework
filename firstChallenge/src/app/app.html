<main style="padding: 2rem; font-family: Arial, sans-serif;">
  <h1>Reto: Arrow vs Regular Functions</h1>

  <div style="margin-bottom: 1rem;">
    <label for="inputNumero">Ingresa un número: </label>
    <input
      id="inputNumero"
      type="number"
      [(ngModel)]="numeroIngresado"
      placeholder="Escribe un número aquí"
    />
  </div>

  <div style="display: flex; gap: 10px;">
    <button (click)="evaluarRegular(numeroIngresado)">
      Probar Regular Function
    </button>
    <button (click)="evaluarArrow(numeroIngresado)">
      Probar Arrow Function
    </button>
  </div>

  <p style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
    * Revisa la consola del navegador (F12) para ver los resultados.
  </p>
</main>

<router-outlet></router-outlet>
